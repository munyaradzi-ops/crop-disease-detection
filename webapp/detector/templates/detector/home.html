<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tomato Disease Detector</title>

</head>

<body>

    <h1>🌱 Tomato Disease Detector</h1>

    <p>
        Upload a tomato leaf image to detect possible disease.
    </p>


    <form
        method="POST"
        enctype="multipart/form-data"
    >

        {% csrf_token %}

        <input
            type="file"
            name="image"
            accept="image/*"
            required
        >

        <br><br>

        <button type="submit">
            Predict Disease
        </button>

    </form>
j

    {% if prediction %}

        <hr>

        <h2>Prediction Result</h2>

        <p>
            <strong>Disease:</strong>
            {{ prediction }}
        </p>

        <p>
            <strong>Confidence:</strong>
            {{ confidence|floatformat:2 }}%
        </p>

    {% endif %}


</body>

</html>
