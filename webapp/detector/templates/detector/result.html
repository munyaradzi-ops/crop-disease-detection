<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Diagnostic Results</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; color: #333; text-align: center; padding: 50px 20px; }
        .card { background: white; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #2e7d32; }
        img { max-width: 100%; height: auto; border-radius: 8px; margin: 20px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .result-box { background: #e8f5e9; padding: 15px; border-left: 5px solid #2e7d32; border-radius: 4px; text-align: left; margin-top: 20px; }
        .back-link { display: inline-block; margin-top: 30px; color: #2e7d32; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📋 Diagnosis Report</h1>
        <img src="{{ file_url }}" alt="Analyzed Leaf">
        
               <div class="result-box">
            <strong style="font-size: 18px; color: #1b5e20;">📋 AI Diagnosis: {{ prediction }}</strong> <br>
            <span style="color: #666;">Diagnostic Confidence: {{ confidence }}</span>
        </div>

        <h3 style="text-align: left; margin-top: 30px; color: #333;">🛡️ Recommended Treatment Protocol</h3>
        
        <div style="text-align: left; background: #fffde7; padding: 15px; border-left: 5px solid #fbc02d; margin-bottom: 15px; border-radius: 4px;">
            <strong style="color: #f57f17;">🌱 Organic Remedies</strong>
            <p style="margin: 5px 0 0 0; font-size: 14px; color: #444;">{{ organic_cure }}</p>
        </div>

        <div style="text-align: left; background: #eeffff; padding: 15px; border-left: 5px solid #00b0ff; margin-bottom: 15px; border-radius: 4px;">
            <strong style="color: #0091ea;">🧪 Chemical Controls</strong>
            <p style="margin: 5px 0 0 0; font-size: 14px; color: #444;">{{ chemical_cure }}</p>
        </div>

        <div style="text-align: left; background: #f3e5f5; padding: 15px; border-left: 5px solid #ab47bc; margin-bottom: 15px; border-radius: 4px;">
            <strong style="color: #7b1fa2;">🛡️ Preventative Action Plan</strong>
            <p style="margin: 5px 0 0 0; font-size: 14px; color: #444;">{{ prevention_plan }}</p>
        </div>

        
        <a href="{% url 'index' %}" class="back-link">← Scan Another Leaf</a>
    </div>
</body>
</html>
